name: Convert Staged Images to AVIF

on:
  push:
    paths:
      - 'staging/**'

concurrency:
  group: image-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install sharp

      - name: Convert images to AVIF
        run: node scripts/process-images.js

      - name: Commit AVIF images
        run: |
          git config user.name 'Sedon Image Processor'
          git config user.email 'actions@github.com'
          git add images/ staging/
          git diff --staged --quiet || git commit -m "chore: convert staged images to AVIF [skip ci]"
          git push

      - name: Notify Sedon VPS (upgrade DB URLs)
        if: env.MAPPINGS != ''
        env:
          MAPPINGS: ${{ env.MAPPINGS }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SEDON_WEBHOOK_URL: ${{ secrets.SEDON_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SEDON_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"mappings\":$MAPPINGS}"
